<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albion Craft · Placas, Arcos & Bestas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">⚒️ Albion Craft <span>Placas · Arcos · Bestas · Culinária · Refino</span></div>
  <nav id="tabs">
    <button data-view="plan" class="active">Planejador</button>
    <button data-view="rank">Ranking de lucro</button>
    <button data-view="refine">Refino</button>
    <button data-view="food">🍲 Culinária</button>
    <button data-view="prices">Preços</button>
    <button data-view="config">Config</button>
  </nav>
  <div id="dailyBonusNav" class="daily-bonus-nav" title="Bônus Diário de Produção Ativo em Albion">
    <span class="bonus-label">📅 Bônus Hoje:</span>
    <select id="headerDailyBonusSelect" class="bonus-select"></select>
  </div>
  <div id="saveStatus" class="muted"></div>
  <div id="liveBadge" class="live-badge" title="Status do Leitor de Pacotes em Tempo Real">
    <span class="live-dot"></span>
    <span id="liveText" class="live-text">Leitor: Iniciando...</span>
  </div>
</header>
<main id="view"></main>
<div id="toast"></div>
<div id="histModal" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-header">
      <div id="histHeader" class="modal-title"></div>
      <button id="histClose" class="modal-close" title="Fechar (Esc)">✕</button>
    </div>
    <div id="histBody" class="modal-body"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
